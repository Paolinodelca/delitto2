<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>FRINGE / LEAK — Play</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 2rem;
      max-width: 700px;
      margin: auto;
    }

    #pressure-container {
      margin: 20px 0;
    }

    #pressure-bar {
      height: 8px;
      width: 0%;
      background: linear-gradient(90deg, #6b7280, #111827);
      transition: width 0.6s ease;
    }

    #pressure-label {
      font-size: 0.8rem;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>

  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
