Delitto ambientato in una villa sul lago di Como negli anni 50.
Vittima è Carlo Brambilla, industriale di 65 anni: la villa è la sua.
Delitto avvenuto nella notte tra sabato e domenica, verso le 23:00.
Ospiti presenti in villa nella notte: Riccardo Brambilla, figlio della vittima; Elena Bella, fidanzata di riccardo; Dario Rossi, socio (di minoranza) della vittima.
Altre presenze: Ernesto il giardiniere della villa. Dorme in una piccola casa adiacente alla villa, dove vive assieme alla moglie Camilla che fa da cuoca e governante della villa.
Carlo vuole vendere la sua industria (produce motoscafi di lusso??) ad un finanziere straniero perchè vorrebbe ritirarsi.
Riccardo non vuole che ci sia la vendita dell'azienda: vorrebbe essere lui a prendere le redini dell'attività ma il padre Carlo non lo ritiene all'altezza: attrito in famiglia.
La fidanzata di Riccardo, Elena, accompagna Riccardo ma ha segretamente una relazione con Carlo. La notte del delitto ha una discussione con Carlo.
Dario rossi ha debiti di gioco che ripaga sottraendo segretamente finanze alla società: la società risulterà essere sull'orlo del fallimento.
La sera del delitto, prima della cena, arriva un telegramma indirizzato a Carlo che segnala la mancanza di fondi per fare il pagamento di un grande fornitore dell'azienda.
Elena è incinta di Carlo: Carlo vorrebbe che Elena si sposasse con Riccardo ma Elena non vuole (discussione della sera del delitto)
Riccardo esce in giardino a fumare nei minuti primaa del delitto. In quei minuti Elena esce dalla stanza e si reca da Carlo per parlargli.
Dopo la discussione con Elena Carlo si reca nella camera di Dario per chiedergli il perchè della mancanza di fondi.
Quando Elena torna nella camera, Riccardo era già rientrato: elena risponde con una bugia alla domanda "ma dove dei andata?"
Dario durante una discussione nella sua camera perde la testa e spacca una statuetta sulla testa di Carlo uccidendolo.
Dario trasporta il corpo della vittima nella sua stanza e prova ad inscenare un incidente, nel quale Carlo sarebbe caduto da una scaletta.
Dario ritorna nella sua stanza come se nulla fosse successo.
Nella camera di Dario ci sono cocci di statuetta rotta sotto un armadio. Le statuette erano 2 ma dopo il delitto ne rimane una: Camilla può rendersi conto che manca.
